<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン — レベル別英単語テスト</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  min-height: 100vh;
  background: #f0f4f9;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.card {
  width: 100%;
  max-width: 380px;
  background: #fff;
  border-radius: 16px;
  border: 1px solid rgba(0,0,0,0.08);
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  padding: 40px 36px;
}
.app-icon {
  width: 48px;
  height: 48px;
  background: #0075de;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  margin-bottom: 20px;
}
.app-title {
  font-size: 20px;
  font-weight: 700;
  color: rgba(0,0,0,0.88);
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.app-sub {
  font-size: 13px;
  color: #a39e98;
  margin-bottom: 36px;
  line-height: 1.5;
}
.login-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 20px;
  border-radius: 10px;
  border: none;
  background: #0075de;
  font-family: inherit;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.15s, transform 0.1s;
}
.login-btn:hover { background: #005bab; }
.login-btn:active { transform: scale(0.99); }
.btn-icon {
  width: 36px;
  height: 36px;
  background: rgba(255,255,255,0.2);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.btn-text { text-align: left; }
.btn-label {
  display: block;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
}
.btn-sub {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: rgba(255,255,255,0.72);
  margin-top: 2px;
}
.divider {
  margin: 28px 0 0;
  padding-top: 24px;
  border-top: 1px solid rgba(0,0,0,0.07);
  font-size: 11px;
  color: #c5c1bd;
  text-align: center;
  line-height: 1.6;
}
</style>
</head>
<body>
<div class="card">
  <div class="app-icon">📘</div>
  <div class="app-title">レベル別英単語テスト</div>
  <div class="app-sub">エピスミントサイトのアカウントでログインしてください</div>

  <a href="./epis/" class="login-btn">
    <div class="btn-icon">🔑</div>
    <div class="btn-text">
      <span class="btn-label">エピスミントサイトでログイン</span>
      <span class="btn-sub">まなびログ・整序トレーニングと同じID/PW</span>
    </div>
  </a>

  <div class="divider">エピスオンラインの生徒・保護者専用アプリです</div>
</div>
</body>
</html>
