<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザー管理 — レベル別英単語テスト</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  background: #f4f7fd;
  min-height: 100vh;
  color: #1a1f2e;
}

/* ── ログイン画面 ── */
#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.login-card {
  width: 100%;
  max-width: 380px;
  background: #fff;
  border-radius: 14px;
  border: 1px solid #dde2ed;
  box-shadow: 0 8px 32px rgba(30,40,80,0.10);
  overflow: hidden;
}
.login-card-header {
  background: #3b6fd4;
  padding: 28px 32px 24px;
}
.login-card-header .app-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.7);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.login-card-header .app-title {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 2px;
}
.login-card-header .app-sub {
  font-size: 12px;
  color: rgba(255,255,255,0.7);
}
.login-card-body {
  padding: 28px 32px 24px;
}
.login-card-body h2 {
  font-size: 14px;
  font-weight: 700;
  color: #1a1f2e;
  margin-bottom: 20px;
}

/* ── 管理画面 ── */
#adminScreen { display: none; }
.topbar {
  height: 56px;
  background: #3b6fd4;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-badge {
  background: rgba(255,255,255,0.2);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
}
.topbar-title { font-size: 14px; font-weight: 700; color: #fff; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.main {
  max-width: 700px;
  margin: 32px auto;
  padding: 0 20px 60px;
}

/* ── カード共通 ── */
.panel {
  background: #fff;
  border-radius: 10px;
  border: 1px solid #dde2ed;
  margin-bottom: 20px;
  overflow: hidden;
}
.panel-header {
  background: #f5f7fb;
  border-bottom: 1px solid #dde2ed;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-title {
  font-size: 13px;
  font-weight: 700;
  color: #1e2b4a;
}
.panel-body { padding: 20px; }

/* ── フォーム ── */
.field { margin-bottom: 14px; }
label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #4a5568;
  margin-bottom: 5px;
}
input[type="text"],
input[type="password"] {
  width: 100%;
  border: 1px solid #c8d0e0;
  border-radius: 6px;
  padding: 8px 11px;
  font-size: 14px;
  color: #1a1f2e;
  background: #f9fafc;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}
input:focus {
  border-color: #3b6fd4;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(59,111,212,0.12);
}
.inline-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 10px;
  align-items: end;
}

/* ── ボタン ── */
.btn {
  padding: 8px 16px;
  border-radius: 6px;
  border: none;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: background 0.15s, opacity 0.15s;
}
.btn-primary { background: #3b6fd4; color: #fff; }
.btn-primary:hover { background: #2f5cb8; }
.btn-primary:disabled { background: #a0aec0; cursor: default; }
.btn-danger { background: #fff0f0; color: #c0392b; border: 1px solid #f5c6c6; }
.btn-danger:hover { background: #ffe0e0; }
.btn-ghost { background: transparent; color: #7b9ec8; border: 1px solid #3d5278; }
.btn-ghost:hover { background: rgba(123,158,200,0.12); color: #fff; }
.btn-full { width: 100%; padding: 10px; font-size: 14px; }

/* ── メッセージ ── */
.msg {
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 14px;
  display: none;
}
.msg-error   { background: #fff5f5; border: 1px solid #f5c6c6; color: #c0392b; }
.msg-success { background: #f0fdf4; border: 1px solid #a7f3c8; color: #15803d; }

/* ── テーブル ── */
.user-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.user-table th {
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  color: #7b8ea8;
  letter-spacing: 0.06em;
  padding: 0 12px 10px;
  border-bottom: 1px solid #dde2ed;
  background: #f5f7fb;
}
.user-table th:first-child { border-radius: 0; padding-left: 20px; }
.user-table th:last-child { padding-right: 20px; }
.user-table td {
  padding: 12px 12px;
  border-bottom: 1px solid #eef1f6;
  vertical-align: middle;
}
.user-table td:first-child { padding-left: 20px; }
.user-table td:last-child { padding-right: 20px; }
.user-table tr:last-child td { border-bottom: none; }
.user-table tr:hover td { background: #f9fafc; }
.user-id {
  font-weight: 700;
  color: #1e2b4a;
  font-variant-numeric: tabular-nums;
}
.user-date { color: #94a3b8; font-size: 12px; }
.empty-state {
  text-align: center;
  padding: 36px 20px;
  color: #94a3b8;
  font-size: 13px;
}
.count-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #3b6fd4;
  color: #fff;
  border-radius: 99px;
  padding: 1px 8px;
  font-size: 11px;
  font-weight: 700;
  min-width: 22px;
}
.hint { font-size: 11px; color: #94a3b8; margin-top: 10px; }
.back-link {
  display: block;
  text-align: center;
  margin-top: 16px;
  font-size: 12px;
  color: #7b9ec8;
  text-decoration: none;
  padding: 10px 0;
  border-top: 1px solid #dde2ed;
  transition: color 0.15s;
}
.back-link:hover { color: #3b6fd4; }
</style>
</head>
<body>

<!-- ── ログイン画面 ── -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-card-header">
      <div class="app-label">Admin Panel</div>
      <div class="app-title">レベル別英単語テスト</div>
      <div class="app-sub">管理者専用画面</div>
    </div>
    <div class="login-card-body">
      <h2>管理者ログイン</h2>
      <div class="msg msg-error" id="loginErr"></div>
      <form id="loginForm">
        <div class="field">
          <label>管理者パスワード</label>
          <input type="password" id="adminPw" placeholder="パスワードを入力" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">ログイン</button>
      </form>
    </div>
    <a href="../epis/" class="back-link">← 生徒のログイン画面へ</a>
  </div>
</div>

<!-- ── 管理画面 ── -->
<div id="adminScreen">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-badge">Admin</span>
      <span class="topbar-title">ユーザー管理</span>
    </div>
    <div class="topbar-right">
      <button class="btn btn-ghost" onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="main">

    <!-- ユーザー追加 -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">ユーザーを追加</div>
      </div>
      <div class="panel-body">
        <div class="msg msg-error"   id="addErr"></div>
        <div class="msg msg-success" id="addOk"></div>
        <div class="inline-row">
          <div class="field" style="margin:0">
            <label>ユーザーID</label>
            <input type="text" id="newId" placeholder="例: student01" autocomplete="off"
              pattern="[a-zA-Z0-9]+" title="アルファベットと数字のみ">
          </div>
          <div class="field" style="margin:0">
            <label>パスワード</label>
            <input type="password" id="newPw" placeholder="6文字以上" autocomplete="new-password">
          </div>
          <button class="btn btn-primary" onclick="addUser()">追加</button>
        </div>
        <p class="hint">IDはアルファベット・数字のみ。パスワードは6文字以上。</p>
      </div>
    </div>

    <!-- ユーザー一覧 -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">登録ユーザー一覧</div>
        <span class="count-badge" id="userCount">0</span>
      </div>
      <div class="msg msg-success" id="delOk" style="margin:12px 20px 0;"></div>
      <table class="user-table">
        <thead>
          <tr>
            <th>ユーザーID</th>
            <th>登録日時</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none">
        登録ユーザーがいません
      </div>
    </div>

  </div>
</div>

<script>
const ADMIN_PW_HASH = '1302feab3f480c34c382951164966ae2e3e27fd3966c18583f714e84ff6849a6';
const STORAGE_KEY = 'vocab_simple_users';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function showMsg(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = '確認中...';

  const pw   = document.getElementById('adminPw').value;
  const hash = await sha256(pw);

  if (hash === ADMIN_PW_HASH) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
    renderUsers();
  } else {
    const err = document.getElementById('loginErr');
    err.textContent = 'パスワードが正しくありません。';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'ログイン';
  }
});

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminScreen').style.display = 'none';
  document.getElementById('adminPw').value = '';
}

function loadUsers() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}

function saveUsers(users) { localStorage.setItem(STORAGE_KEY, JSON.stringify(users)); }

function renderUsers() {
  const users = loadUsers();
  const tbody = document.getElementById('userTableBody');
  const empty = document.getElementById('emptyState');
  document.getElementById('userCount').textContent = users.length;
  tbody.innerHTML = '';
  if (users.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  users.forEach((u, i) => {
    const tr = document.createElement('tr');
    const date = u.createdAt
      ? new Date(u.createdAt).toLocaleString('ja-JP', {
          year:'numeric', month:'2-digit', day:'2-digit',
          hour:'2-digit', minute:'2-digit'
        })
      : '—';
    tr.innerHTML = `
      <td><span class="user-id">${escHtml(u.id)}</span></td>
      <td><span class="user-date">${date}</span></td>
      <td style="text-align:right">
        <button class="btn btn-danger" onclick="deleteUser(${i})">削除</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

async function addUser() {
  const id = document.getElementById('newId').value.trim();
  const pw = document.getElementById('newPw').value;
  if (!id || !pw) { showMsg('addErr', 'IDとパスワードを入力してください。'); return; }
  if (!/^[a-zA-Z0-9]+$/.test(id)) { showMsg('addErr', 'IDはアルファベットと数字のみ使用できます。'); return; }
  if (pw.length < 6) { showMsg('addErr', 'パスワードは6文字以上にしてください。'); return; }
  const users = loadUsers();
  if (users.some(u => u.id === id)) { showMsg('addErr', `ID "${id}" はすでに登録されています。`); return; }
  const hash = await sha256(pw);
  users.push({ id, hash, createdAt: Date.now() });
  saveUsers(users);
  document.getElementById('newId').value = '';
  document.getElementById('newPw').value = '';
  renderUsers();
  showMsg('addOk', `"${id}" を追加しました。`);
}

function deleteUser(index) {
  const users = loadUsers();
  const id = users[index]?.id;
  if (!id) return;
  if (!confirm(`"${id}" を削除しますか？`)) return;
  users.splice(index, 1);
  saveUsers(users);
  renderUsers();
  showMsg('delOk', `"${id}" を削除しました。`);
}

function escHtml(str) {
  return str.replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
